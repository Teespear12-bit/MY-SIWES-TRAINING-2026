<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style2.css" />
  </head>
  <body>
    <div class="container">
      <div class="navbar"> <!--Created a nav bar-->
        <div class="logo">AETSS</div> <!--Created my logo (AETSS)-->
        <div class="navlinks"> <!--Created some navlinks (They do not link to anything yet tho) -->
          <div class="navs"><a href="index.html">Home</a></div>
          <div class="navs"><a href="#">Calendar</a></div>
          <div class="navs"><a href="#">Courses</a></div>
          <div class="navs"><a href="#">Login</a></div>
        </div>
      </div>
      <div class="regformcont"><!--Created this to house everything except the navbar-->
        <div class="status" id="status"><!--Created this to show registration successful-->
          <p class="regcoment" id="regcoment">Registration Succesful ✅</p>
          <p class="regcoment2" id="regcoment2">
            Congrats! you've succesfully registered!!
          </p><!--But i used css to make the visibility hidden, It later becomes visible when conditions in js are met-->
        </div>
        <div class="Formcont"><!--The form-->
          <form class="FORM" id="FORM">
            <div class="input-tags">
              <label class="inputlabels">FIRST NAME:</label>

              <input
                class="inputbox"
                id="Firstname"
                type="text"
                placeholder="Your first name"
              />
              <div class="errormessage">Error</div><!--Helps show errors--><!--made it's visibility hidden in the css and it becomes visible when js sees a conditon is not meet-->
              <br /><br />
            </div>

            <div class="input-tags">
              <label class="inputlabels">LAST NAME: </label>
              <input
                class="inputbox"
                id="lastname"
                type="text"
                placeholder="Your last name"
              />
              <div class="errormessage">Error</div>
              <br /><br />
            </div>
            <div class="input-tags">
              <label class="inputlabels" for="email">EMAIL:</label>
              <input
                class="inputbox"
                id="email"
                type="email"
                placeholder="Your email"
              />
              <div class="errormessage">Error</div>
              <br /><br />
            </div>

            <div class="input-tags">
              <label class="inputlabels" for="number">PHONE NUMBER:</label>

              <input
                class="inputbox"
                id="number"
                type="tel"
                placeholder="Phone number"
              />
              <div class="errormessage">Error</div>
              <br /><br />
            </div>
            <div class="input-tags">
              <label class="inputlabels" for="department">DEPARTMENT:</label>

              <input
                class="inputbox"
                id="department"
                type="text"
                placeholder="Your department"
              />
              <div class="errormessage">Error</div>
              <br /><br />
            </div>
            <div class="input-tags">
              <label class="inputlabels" for="level">LEVEL:</label>

              <select
                class="inputbox"
                id="level"
                type="text"
                placeholder="Your level"
              >
                <option class="lvls" value="">none</option>
                <option class="lvls">100 LEVEL</option>
                <option class="lvls">200 LEVEL</option>
                <option class="lvls">300 LEVEL</option>
                <option class="lvls">400 LEVEL</option>
                <option class="lvls">500 LEVEL</option>
                <option class="lvls">600 LEVEL</option>
              </select>

              <div class="errormessage">Error</div>
              <br /><br />
            </div>

            <!-- <div class="my-button"> -->
            <button class="my-button" type="submit">SUBMIT</button>
            <!-- </div> -->
          </form>
        </div>
      </div>
    </div>
    <script src="registration.js"></script>
  </body>
</html>
