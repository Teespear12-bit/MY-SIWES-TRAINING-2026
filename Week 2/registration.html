<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style2.css" />
  </head>
  <body>
    <div class="container">
      <div class="navbar">
        <div class="logo">AETSS</div>
        <div class="navlinks">
          <div class="navs"><a href="index.html">Home</a></div>
          <div class="navs"><a href="#">Calendar</a></div>
          <div class="navs"><a href="#">Courses</a></div>
          <div class="navs"><a href="#">Login</a></div>
        </div>
      </div>
      <div class="regformcont">
        <form class="FORM">
          <div class="input-tags">
            <label class="inputlabels">FIRST NAME:</label>
            <input
              class="inputbox"
              type="text"
              placeholder="Your  first name"
            /><br /><br />
          </div>

          <div class="input-tags">
            <label class="inputlabels">LAST NAME:</label>
            <input
              class="inputbox"
              type="text"
              placeholder="Yourlast name"
            /><br /><br />
          </div>
          <div class="input-tags">
            <label class="inputlabels">EMAIL:</label>
            <input
              class="inputbox"
              type="email"
              placeholder="Your email"
            /><br /><br />
          </div>

          <div class="input-tags">
            <label class="inputlabels"> PHONE NUMBER:</label>
            <input
              class="inputbox"
              type="tel"
              placeholder="Phone number"
            /><br /><br />
          </div>
          <div class="input-tags">
            <label class="inputlabels"> DEPARTMENT:</label>
            <input
              class="inputbox"
              type="tel"
              placeholder="Your department"
            /><br /><br />
          </div>
          <div class="input-tags">
            <label class="inputlabels">LEVEL:</label>
            <input
              class="inputbox"
              type="tel"
              placeholder="Your level"
            /><br /><br />
          </div>

          <!-- <div class="my-button"> -->
          <button class="my-button" type="submit">SUBMIT</button>
          <!-- </div> -->
        </form>
      </div>
    </div>
  </body>
</html>
