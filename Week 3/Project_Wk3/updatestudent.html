<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Update Student - AETSS</title>
  <link rel="stylesheet" href="updatestudent.css" />

</head>
<body>
  <div class="navbar">
    <div class="logo">AETSS</div>
    <div class="navlinks">
      <div class="navs"><a href="index.html">Home</a></div>
      <div class="navs"><a href="#">Calendar</a></div>
      <div class="navs"><a href="#">Courses</a></div>
      <div class="navs"><a href="#">Login</a></div>
    </div>
  </div>

  <div class="operationarea">
    <div class="container">
      <h1 class="heading">UPDATE STUDENT</h1>
      
      <form id="update-form">
        <label for="update-id">Student ID to Update:</label>
        <input type="number" id="update-id" required class="enter"><br><br>

        <label for="update-name">New Name:</label>
        <input id="update-name" required class="enter"><br><br>

        <label for="update-age">New Age:</label>
        <input type="number" id="update-age" required class="enter"><br><br>

        <label for="update-course">New Course:</label>
        <input id="update-course" required class="enter"><br><br>

        <button type="submit">UPDATE</button>
      </form>

      <div id="message"></div>
    </div>

    <div class="goback">
      <a href="operations.html"> >GO BACK </a>
    </div>
  </div>

  <script src="shared.js"></script>
  <script src="updatestudent.js"></script>
</body>
</html>
