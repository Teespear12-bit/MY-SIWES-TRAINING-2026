<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/removestudents.css}" />
    <title>Remove Student</title>
</head>
<body>
    <div class="navbar">
        <div class="logo">AETSS</div>
        <div class="navlinks">
            <div class="navs"><a th:href="@{/studentMG}">Home</a></div>
            <div class="navs"><a href="#">Calendar</a></div>
            <div class="navs"><a href="#">Courses</a></div>
            <div class="navs"><a href="#">Login</a></div>
        </div>
    </div>

    <div class="operationarea">
        <div class="container">
            <h1 class="heading">REMOVE STUDENT</h1>
            
            <!-- Error message display -->
            <p class="error" th:if="${errorMessage}" th:text="${errorMessage}" style="color: red; font-weight: bold;"></p>
            <p class="success" th:if="${successMessage}" th:text="${successMessage}"></p>

            <form th:action="@{/studentMG/students/delete-search}" method="get">
                <label for="id">Enter Student ID to Remove:</label>
                <input type="number" id="id" name="id" class="enter" required><br><br>

                <button id="delete-btn" type="submit">REMOVE</button>
            </form>
            
        </div>

        <div class="goback">
            <a th:href="@{/studentMG}"> >GO BACK </a>
        </div>
    </div>
</body>
</html>
