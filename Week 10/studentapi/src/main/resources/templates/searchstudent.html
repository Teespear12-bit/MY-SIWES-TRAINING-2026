<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Student - AETSS</title>
  <link rel="stylesheet" th:href="@{/css/searchstudents.css}" />
  <link rel="stylesheet" th:href="@{/css/fragment.css}" />
</head>
<body>
 <div th:replace= "fragments :: navbar"></div>

  <div class="operationarea">
    <div class="container">
      <h1 class="heading">SEARCH STUDENT</h1>
      
      <!-- Displays error if student ID does not exist -->
      <p class="error" th:if="${errorMessage}" th:text="${errorMessage}" style="color: red; font-weight: bold;"></p>

      
      <form th:action="@{/AETSS/studentMG/students/search}" method="get">
        <label for="searchID">Enter Student ID:</label>
        <input id="searchID" name="id" class="enter" type="number" required>
        <button id="search-btn" type="submit">SEARCH</button>
      </form>
    </div>

    <div th:replace="fragments :: goback"></div>
  </div>
</body>
</html>
